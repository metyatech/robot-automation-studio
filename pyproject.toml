[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "robot-automation-studio"
version = "0.1.0"
description = "Desktop app to record, edit, run, and export Robot Framework automation scenarios."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "metyatech" }]
dependencies = [
  "robotframework>=7.0.0,<8.0.0",
  "robotframework-unity-editor @ git+https://github.com/metyatech/robotframework-unity-editor.git@main",
  "pywinauto>=0.6.8,<1.0.0",
  "pynput>=1.7.7,<2.0.0",
  "Pillow>=12.1.1,<13.0.0",
  "PySide6>=6.6.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.13.0,<1.0.0",
  "pyright>=1.1.403,<2.0.0",
  "pip-audit>=2.9.0,<3.0.0",
  "pre-commit>=4.3.0,<5.0.0",
  "types-Pillow>=10.2.0.20240822",
]

[project.scripts]
robot-automation-studio = "robot_automation_studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_automation_studio"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: live environment integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
